<!DOCTYPE html>
<html>
<head>
	<title>nasha's home ❤︎</title>
	<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka:wght@600&display=swap" rel="stylesheet">
	<style>
		body {
			background-color: #FDF6E9;
			font-family: 'Fredoka', sans-serif;
			padding: 30px;
		}

		.board {
			max-width: 950px;
			margin: 0 auto;
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			grid-auto-rows: 130px;
			gap: 8px;
		}

		.board div img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			border-radius: 6px;
		}

		.title {
			display: flex;
			align-items: center;
			justify-content: center;
			grid-column: 2 / 4;
			grid-row: 2 / 4;
			font-family: 'Caveat', cursive;
			font-size: 60px;
			font-weight: 700;
			text-align: center;
			line-height: 0.9;
			color: #DE3163;
		}

		.note {
			background-color: #FFCAE9;
			border-radius: 8px;
			padding: 8px;
			font-size: 12px;
			text-align: center;
			display: flex;
			align-items: center;
			justify-content: center;
			color: #7A1F42;
		}

		/* posisi foto & catatan */
		.p1 { grid-column: 1 / 2; grid-row: 1 / 3; }
		.p2 { grid-column: 2 / 3; grid-row: 1 / 2; }
		.n1 { grid-column: 1 / 2; grid-row: 3 / 4; }
		.p3 { grid-column: 2 / 3; grid-row: 4 / 5; }
		.p4 { grid-column: 1 / 2; grid-row: 4 / 6; }

		.p5 { grid-column: 3 / 4; grid-row: 1 / 2; }
		.n2 { grid-column: 4 / 5; grid-row: 1 / 2; }
		.p6 { grid-column: 4 / 5; grid-row: 2 / 4; }
		.p7 { grid-column: 3 / 4; grid-row: 4 / 5; }
		.n3 { grid-column: 3 / 4; grid-row: 5 / 6; }
		.p8 { grid-column: 4 / 5; grid-row: 4 / 6; }

		.p9  { grid-column: 1 / 2; grid-row: 6 / 8; }
		.p10 { grid-column: 2 / 3; grid-row: 6 / 8; }
		.p11 { grid-column: 3 / 4; grid-row: 6 / 7; }
		.n4  { grid-column: 3 / 4; grid-row: 7 / 8; }
		.p12 { grid-column: 4 / 5; grid-row: 6 / 8; } 
		.p13 { grid-column: 2 / 3; grid-row: 5 / 6; }
	</style>
</head>
<body>

	<div class="board">
		<div class="p1"><img src="images/FT - UI.jpg"></div>
		<div class="p2"><img src="images/studyy.jpg"></div>
		<div class="n1 note">study study study</div>
		<div class="p3"><img src="images/macan.jpg"></div>
		<div class="p4"><img src="images/medals.jpg"></div>

		<div class="title">me<br>in the<br>future</div>

		<div class="p5"><img src="images/concert.jpg"></div>
		<div class="n2 note">♡ reduce unnecessary spending to save more</div>
		<div class="p6"><img src="images/pilates.jpg"></div>
		<div class="p7"><img src="images/glow.jpg"></div>
		<div class="n3 note">success</div>
		<div class="p8"><img src="images/matcha.jpg"></div>

		<div class="p9"><img src="images/cook.jpg"></div>
		<div class="p10"><img src="images/aamiin.jpg"></div>
		<div class="p11"><img src="images/film.jpg"></div>
		<div class="n4 note">rich pretty smart</div>
		<div class="p12"><img src="images/summer.jpg"></div>
		<div class="p13"><img src="images/drive 2.jpg"></div>
	</div>

	<p 
		<a href="index.html">home</a> |
		<a href="favbook.html">table</a> |
		<a href="formnasha.html">form</a> |
		<a href="video.html">photos</a> 
	</p>

</body>
</html>
